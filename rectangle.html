<!DOCTYPE html>
<html>
<head>
    <title>Rectangle Portion</title>
    <style>
        .rectangle-image {
            width: 150px;
            height: 100px;
            overflow: hidden;
        }

        .rectangle-image img {
            width: 500px;
            height: 350px;
            position: relative;
            left: -200px;
            top: -50px;
        }
    </style>
</head>
<body>

    <h1>Selected Image Portion</h1>

    <div class="rectangle-image">
        <img src="tree.jpg" alt="Rectangular portion of train image">
    </div>

</body>
</html>
