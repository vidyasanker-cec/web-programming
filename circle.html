<!DOCTYPE html>
<html>
<head>
    <title>Circle Portion</title>
    <style>
        .circle-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
        }

        .circle-image img {
            width: 500px;
            height: 350px;
            object-fit: fill;
            position: relative;
            left: -50px;
            top: -50px;
        }
    </style>
</head>
<body>

    <h1>Selected Image Portion</h1>

    <div class="circle-image">
        <img src="tree.jpg" alt="Circular portion of train image">
    </div>

</body>
