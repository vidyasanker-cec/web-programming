<!DOCTYPE html>
<html>
<head>
    <title>HTML Image Map Example</title>

    <style>
        .image-container {
            position: relative;
            width: 500px;
            height: 350px;
        }

        .image-container img {
            width: 500px;
            height: 350px;
        }

        .circle {
            position: absolute;
            left: 50px;
            top: 50px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            cursor: pointer;
        }

        .circle:hover {
            border: 3px solid red;
        }

        .rectangle {
            position: absolute;
            left: 200px;
            top: 50px;
            width: 150px;
            height: 100px;
            cursor: pointer;
        }

        .rectangle:hover {
            border: 3px solid blue;
        }
        .polygon {
            position: absolute;
            left: 250px;
            top: 200px;
            width: 150px;
            height: 120px;
            cursor: pointer;
        }

        .polygon polygon {
            fill: transparent;
            stroke: transparent;
            stroke-width: 3;
            vector-effect: non-scaling-stroke;
        }

        .polygon:hover polygon {
            stroke: green;
        }
    </style>
</head>

<body>

    <h1>HTML Image Map</h1>

    <div class="image-container">

        <img src="tree.jpg" alt="Train">

        <a href="circle.html" class="circle"
           </a>
        <a href="rectangle.html" class="rectangle"></a>

        <a href="polygon.html" class="polygon">

        <svg width="150" height="120" viewBox="0 0 150 120">
              <polygon points="0,0 100,0 150,80 50,120" />
        </svg>
        </a>

    </div>
</body>
</html>
